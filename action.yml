name: OpenPulse dependency intelligence
# Marketplace limit: the description must stay under 125 characters.
description: Evidence-first dependency trust gates and upstream change alerts (EOL, licence, registry), as SARIF and a job summary.
author: IkarusAILabs
branding:
  icon: activity
  color: blue

inputs:
  manifest:
    description: requirements.txt / pyproject.toml / pom.xml / go.mod / Cargo.toml path
    required: false
    default: ''
  lockfile:
    description: package-lock.json / poetry.lock / Cargo.lock path
    required: false
    default: ''
  sbom:
    description: CycloneDX JSON SBOM path
    required: false
    default: ''
  spdx:
    description: SPDX 2.x JSON SBOM path
    required: false
    default: ''
  images:
    description: Container image inventory path (one ref per line, or a YAML list)
    required: false
    default: ''
  github-repo:
    description: >-
      owner/repo to auto-discover dependency files through the GitHub API when
      no path input is set. It reads the DEFAULT branch, not a pull request head:
      use path inputs on pull_request.
    required: false
    default: ${{ github.repository }}
  events:
    description: >-
      Whitespace/newline-separated event JSON paths. Empty: the bundled curated
      events (Bitnami catalog, Bitnami Spark, Django 4.2 EOL, iText license).
    required: false
    default: ''
  fail-on:
    description: Fail threshold - affected, review, action, critical, or none
    required: false
    default: action
  github-token:
    description: >-
      Token for github-repo discovery and, with trust pull-request, for reading
      the base copies of the path inputs (passed as env, never argv; needs
      contents read).
    required: false
    default: ${{ github.token }}
  trust:
    description: >-
      Trust checks (malicious records, registry existence, provenance,
      repository linkage, lookalike names; live lookups). off (default),
      pull-request (on pull requests, only dependencies added or changed
      against the base branch's copy of manifest and lockfile), or all.
    required: false
    default: 'off'
  registry-changes:
    description: >-
      Registry changes for each npm and PyPI dependency's own release (live
      lookups): the publisher's deprecation or yank, an Inactive project, and
      license changes in later releases. off (default) or all. Each is a
      REVIEW result, so it fails the step only with fail-on review or
      affected.
    required: false
    default: 'off'
  observe-repositories:
    description: >-
      Record the GitHub repository each npm and PyPI dependency names as its
      source in the kept history, and report a license change, an archive or
      a move to a new owner since the last run (live lookups). off (default)
      or on. Needs history on. The first run is a baseline. Uses github-token
      to read GitHub.
    required: false
    default: 'off'
  policy:
    description: >-
      Trust policy file (docs/TRUST_POLICY.md). Empty: .openpulse/policy.yml
      when it exists. A prohibited condition fails the step.
    required: false
    default: ''
  gate:
    description: >-
      Pre-install gate (docs/TRUST_POLICY.md): whitespace/newline-separated
      dependency files. When set, the step runs only `openpulse gate` on them,
      with the trust policy, so place it before `pip install` or `npm ci`. On a
      pull request only dependencies added or changed against the base branch
      are trust-checked, and the base branch's policy is used. No SARIF.
    required: false
    default: ''
  base-sha:
    description: Base commit for trust pull-request and gate (default the pull request's base)
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  sarif-file:
    description: Where to write the SARIF 2.1.0 log
    required: false
    default: openpulse.sarif
  contracts-file:
    description: Where to write the evidence-contract JSONL
    required: false
    default: openpulse-contracts.jsonl
  upload-sarif:
    description: Upload the SARIF to Code Scanning (needs `security-events write`)
    required: false
    default: 'false'
  python-version:
    description: Python used to run OpenPulse
    required: false
    default: '3.11'
  history:
    description: >-
      Keep OpenPulse's history (observation history and detection ledger)
      between runs in the Actions cache. off (default) or on. Needs
      history-key. The restored history is audited before anything runs: a
      broken, rolled-back, unkeyed or foreign history fails the step. Saved
      only on the default branch.
    required: false
    default: 'off'
  history-key:
    description: >-
      The history key that MACs the history, from a secret
      (`openpulse history-key generate`). Passed to OpenPulse as an
      environment variable only.
    required: false
    default: ''
  history-previous-keys:
    description: Retired history keys, one per line, from a secret (key rotation)
    required: false
    default: ''
  history-id:
    description: >-
      Names the cached history, so jobs that watch different things keep
      separate histories. Letters, digits, '.', '_' and '-'.
    required: false
    default: 'default'

  notify-webhook:
    description: >-
      Send what is new since the last run to this webhook URL as JSON text
      (Slack incoming webhooks and most receivers accept it). Pass it from a
      secret. https and public hosts only. Needs history on; sent only from
      the default branch, and never for a first run.
    required: false
    default: ''
  notify-webhook-secret:
    description: >-
      Sign the webhook post (X-OpenPulse-Signature, HMAC-SHA256 with a
      timestamp) with this secret, at least 32 characters. Pass it from a
      secret.
    required: false
    default: ''
  notify-issue:
    description: >-
      Keep one issue in this repository for what is new since the last run:
      'on' opens it the first time and comments on it afterwards; off
      (default). Needs history on and a github-token with issues: write. Only
      from the default branch, and never for a first run.
    required: false
    default: 'off'

outputs:
  sarif-file:
    description: Path of the SARIF log
    value: ${{ steps.run.outputs.sarif-file }}
  contracts-file:
    description: Path of the evidence-contract JSONL
    value: ${{ steps.run.outputs.contracts-file }}
  inspection-coverage:
    description: Repository inspection coverage (COMPLETE, PARTIAL, FAILED, or NOT_APPLICABLE when no repository was inspected)
    value: ${{ steps.run.outputs.inspection-coverage }}
  threshold-breached:
    description: "'true' when the fail-on threshold or a trust policy was breached"
    value: ${{ steps.run.outputs.threshold-breached || steps.gate.outputs.threshold-breached }}
  receipts:
    description: >-
      With `gate`: the directory of gate receipts, one per gated file. Verify it
      immediately before install: `openpulse gate --verify-receipt <dir> FILE...`
    value: ${{ steps.gate.outputs.receipts }}
  history-status:
    description: >-
      With `history: on`: OK (a history was restored and passed the audit) or
      EMPTY (nothing restored: a first run, or an evicted cache)
    value: ${{ steps.history-audit.outputs.status }}
  new-findings:
    description: >-
      With `history: on`: how many detections this run recorded for the first
      time. On the first run with a history every detection is new, and none
      is delivered.
    value: ${{ steps.run.outputs.new-findings }}
  new-findings-file:
    description: >-
      With `history: on`: a JSON file listing the detections first recorded in
      this run (dependency, type, title, impact, evidence URLs)
    value: ${{ steps.run.outputs.new-findings-file }}

  delivery:
    description: >-
      With notify-webhook or notify-issue: delivered, none (nothing new, or a
      first run), skipped (not the default branch) or failed
    value: ${{ steps.deliver.outputs.delivery }}

runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false

    # Threat: floated transitive deps - install the reviewed lock set, in an
    # isolated venv so the caller's Python environment is untouched.
    - name: Install OpenPulse
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        BASE_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/openpulse-venv"
        "$BASE_PYTHON" -m venv "$venv"
        if [ -x "$venv/bin/python" ]; then bin="$venv/bin"; else bin="$venv/Scripts"; fi
        # Editable on purpose: the action runs the checked-out source as-is
        # (catalog and contract schemas resolve from the source tree; wheels
        # ship them too since #132).
        "$bin/python" -m pip install --disable-pip-version-check -q \
          --require-hashes -r "$ACTION_ROOT/requirements-runtime.lock"
        "$bin/python" -m pip install --disable-pip-version-check -q \
          --no-deps -e "$ACTION_ROOT"
        echo "OPENPULSE_BIN=$bin" >> "$GITHUB_ENV"

    # History between runs (v0.21.0 W2). Threat: a restored cache is input
    # others can write - it is audited with the key before anything runs,
    # and saved only from the default branch.
    - id: history-setup
      if: inputs.history != 'off'
      name: Check the history inputs
      shell: bash
      env:
        IN_HISTORY: ${{ inputs.history }}
        IN_HISTORY_ID: ${{ inputs.history-id }}
        IN_GATE: ${{ inputs.gate }}
        HAS_KEY: ${{ inputs.history-key != '' }}
      run: |
        set -euo pipefail
        case "$IN_HISTORY" in
          on) ;;
          *) echo "::error title=OpenPulse history::unknown history '$IN_HISTORY' (off, on)"; exit 2 ;;
        esac
        if [ -n "$IN_GATE" ]; then
          echo "::warning title=OpenPulse history::history is not used with gate, which keeps none"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$HAS_KEY" != "true" ]; then
          echo "::error title=OpenPulse history::history: on needs history-key (a secret; openpulse history-key generate)"
          exit 2
        fi
        if ! [[ "$IN_HISTORY_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
          echo "::error title=OpenPulse history::history-id must be 1-64 letters, digits, '.', '_' or '-'"
          exit 2
        fi
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - id: history-restore
      if: steps.history-setup.outputs.enabled == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .openpulse/observations
          .openpulse/detections
        key: openpulse-history-v1-${{ inputs.history-id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: openpulse-history-v1-${{ inputs.history-id }}-

    - id: history-audit
      if: steps.history-setup.outputs.enabled == 'true'
      name: Audit the restored history
      shell: bash
      env:
        OPENPULSE_HISTORY_KEY: ${{ inputs.history-key }}
        OPENPULSE_HISTORY_KEYS_PREVIOUS: ${{ inputs.history-previous-keys }}
        RESTORED: ${{ steps.history-restore.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        set +e
        "$OPENPULSE_BIN/openpulse" history-audit --require-keyed
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "::error title=OpenPulse history::the restored history was refused (see the log). It was not used and will not be saved. After checking why, delete the cache entry to start a new history: gh cache delete '$RESTORED'"
          exit 1
        fi
        status="$("$OPENPULSE_BIN/openpulse" history-audit --require-keyed --json | "$OPENPULSE_BIN/python" -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    # Pre-install gate (v0.15.0 Z3): only `openpulse gate`, before anything
    # is installed. Threat: a pull request weakening its own gate - the base
    # copies, the policy and the private-name list come from the base branch.
    - id: gate
      if: inputs.gate != ''
      name: Run openpulse gate
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        IN_GATE: ${{ inputs.gate }}
        IN_POLICY: ${{ inputs.policy }}
        IN_BASE_SHA: ${{ inputs.base-sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        "$OPENPULSE_BIN/python" "$ACTION_ROOT/scripts/action_gate.py"

    # Threat: script injection - every input reaches the shell as an env var
    # and a quoted argv element, never interpolated into the script text.
    - id: run
      if: inputs.gate == ''
      name: Run openpulse attest
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        IN_MANIFEST: ${{ inputs.manifest }}
        IN_LOCKFILE: ${{ inputs.lockfile }}
        IN_SBOM: ${{ inputs.sbom }}
        IN_SPDX: ${{ inputs.spdx }}
        IN_IMAGES: ${{ inputs.images }}
        IN_GITHUB_REPO: ${{ inputs.github-repo }}
        IN_EVENTS: ${{ inputs.events }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_SARIF: ${{ inputs.sarif-file }}
        IN_CONTRACTS: ${{ inputs.contracts-file }}
        IN_TRUST: ${{ inputs.trust }}
        IN_REGISTRY_CHANGES: ${{ inputs.registry-changes }}
        IN_OBSERVE: ${{ inputs.observe-repositories }}
        IN_NOTIFY_ISSUE: ${{ inputs.notify-issue }}
        # Only whether a URL was given: the URL itself is not in this step.
        IN_NOTIFY_WEBHOOK_SET: ${{ inputs.notify-webhook != '' }}
        HISTORY_ENABLED: ${{ steps.history-setup.outputs.enabled }}
        # The history key MACs what observe-repositories records; env only.
        OPENPULSE_HISTORY_KEY: ${{ inputs.history-key }}
        OPENPULSE_HISTORY_KEYS_PREVIOUS: ${{ inputs.history-previous-keys }}
        IN_POLICY: ${{ inputs.policy }}
        IN_BASE_SHA: ${{ inputs.base-sha }}
        IN_TOKEN: ${{ inputs.github-token }}
        # Threat: token in the process list - env only; the CLI resolves it
        # solely for --github-repo.
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        args=()
        [ -n "$IN_MANIFEST" ] && args+=(--manifest "$IN_MANIFEST")
        [ -n "$IN_LOCKFILE" ] && args+=(--lockfile "$IN_LOCKFILE")
        [ -n "$IN_SBOM" ] && args+=(--sbom "$IN_SBOM")
        [ -n "$IN_SPDX" ] && args+=(--spdx "$IN_SPDX")
        [ -n "$IN_IMAGES" ] && args+=(--images "$IN_IMAGES")
        if [ "${#args[@]}" -eq 0 ]; then
          if [ -z "$IN_GITHUB_REPO" ]; then
            echo "::error title=OpenPulse::no path input and no github-repo to discover"
            exit 2
          fi
          args+=(--github-repo "$IN_GITHUB_REPO")
        else
          unset GITHUB_TOKEN
        fi

        events=()
        if [ -n "${IN_EVENTS//[[:space:]]/}" ]; then
          for path in $IN_EVENTS; do events+=(--event "$path"); done
        else
          for name in bitnami spark-mainline-empty django-eol itext-license; do
            events+=(--event "$ACTION_ROOT/data/fixtures/$name/event.json")
          done
        fi

        # Trust checks; on a pull request only for what it adds or changes.
        trust=()
        base_policy=""
        base_private=""
        settings_unavailable=false
        case "$IN_TRUST" in
          off|'') ;;
          all) trust=(--trust) ;;
          pull-request)
            if [ -z "$IN_BASE_SHA" ]; then
              echo "::notice title=OpenPulse trust::trust pull-request: no base commit on a $GITHUB_EVENT_NAME event, trust checks skipped"
            else
              trust=(--trust)
              roles=()
              files=()
              [ -n "$IN_MANIFEST" ] && { roles+=(manifest); files+=("$IN_MANIFEST"); }
              [ -n "$IN_LOCKFILE" ] && { roles+=(lockfile); files+=("$IN_LOCKFILE"); }
              # Threat: a pull request weakening its own gate - the policy and
              # the private-name list come from the base branch when it has them.
              roles+=(policy private)
              files+=("${IN_POLICY:-.openpulse/policy.yml}" ".openpulse/private-packages.txt")
              basedir="$RUNNER_TEMP/openpulse-base"
              rm -rf -- "$basedir"
              fetched="$(GITHUB_TOKEN="$IN_TOKEN" "$OPENPULSE_BIN/python" \
                "$ACTION_ROOT/scripts/action_base_files.py" \
                "$GITHUB_REPOSITORY" "$IN_BASE_SHA" "$basedir" "${files[@]}")"
              base=()
              unavailable=false
              i=0
              while IFS=$'\t' read -r status path file; do
                [ -n "$status" ] || continue
                role="${roles[$i]}"
                i=$((i + 1))
                case "$role:$status" in
                  manifest:found) base+=(--base-manifest "$file") ;;
                  lockfile:found) base+=(--base-lockfile "$file") ;;
                  policy:found) base_policy="$file" ;;
                  private:found) base_private="$file" ;;
                  manifest:unavailable|lockfile:unavailable) unavailable=true ;;
                  policy:unavailable|private:unavailable) settings_unavailable=true ;;
                esac
              done <<< "$fetched"
              if [ "$unavailable" = true ]; then
                # A failure never narrows the checks: check every dependency.
                echo "::warning title=OpenPulse trust::could not read a base file; checking every dependency"
              elif [ "${#base[@]}" -gt 0 ]; then
                trust+=("${base[@]}")
              fi
              if [ "$settings_unavailable" = true ]; then
                echo "::warning title=OpenPulse trust::could not read the base branch's policy or private-name list; using this pull request's copy"
              fi
              [ -n "$base_private" ] && trust+=(--private-names "$base_private")
            fi ;;
          *) echo "::error title=OpenPulse::unknown trust '$IN_TRUST' (off, pull-request, all)"; exit 2 ;;
        esac
        # Repositories of your dependencies (v0.21.0 W3): recorded in the kept
        # history. Without one every run would be a first observation.
        observe=()
        case "$IN_OBSERVE" in
          off|'') ;;
          on)
            if [ "$HISTORY_ENABLED" != "true" ]; then
              echo "::error title=OpenPulse::observe-repositories: on needs history: on and history-key"
              exit 2
            fi
            observe=(--observe-repositories)
            # GitHub is read once per repository: the token (read-only use,
            # sent to api.github.com only) lifts the anonymous rate limit.
            if [ -n "$IN_TOKEN" ]; then export GITHUB_TOKEN="$IN_TOKEN"; fi ;;
          *) echo "::error title=OpenPulse::unknown observe-repositories '$IN_OBSERVE' (off, on)"; exit 2 ;;
        esac
        unset IN_TOKEN
        policy=()
        if [ -n "$base_policy" ]; then
          echo "OpenPulse: using the base branch's trust policy"
          policy=(--policy "$base_policy")
        elif [ -n "$IN_POLICY" ]; then
          policy=(--policy "$IN_POLICY")
        fi

        # Registry changes of each dependency's release (v0.21.0 W1).
        changes=()
        case "$IN_REGISTRY_CHANGES" in
          off|'') ;;
          all) changes=(--registry-changes) ;;
          *) echo "::error title=OpenPulse::unknown registry-changes '$IN_REGISTRY_CHANGES' (off, all)"; exit 2 ;;
        esac

        # Delivery (v0.21.0 W5) sends what the kept ledger had not seen.
        case "$IN_NOTIFY_ISSUE" in
          off|''|on) ;;
          *) echo "::error title=OpenPulse::unknown notify-issue '$IN_NOTIFY_ISSUE' (off, on)"; exit 2 ;;
        esac
        if [ "$HISTORY_ENABLED" != "true" ] && { [ "$IN_NOTIFY_ISSUE" = on ] || [ "$IN_NOTIFY_WEBHOOK_SET" = "true" ]; }; then
          echo "::error title=OpenPulse::notify-webhook and notify-issue need history: on and history-key"
          exit 2
        fi

        # New since the last run (v0.21.0 W4): with a kept history, detections
        # are recorded in its ledger and the first-time ones listed.
        ledger=()
        new_file=""
        if [ "$HISTORY_ENABLED" = "true" ]; then
          new_file="$RUNNER_TEMP/openpulse-new-findings.json"
          rm -f "$new_file"
          ledger=(--ledger .openpulse/detections --new-findings "$new_file")
        fi

        gate=()
        case "$IN_FAIL_ON" in
          none|'') ;;
          affected|review|action|critical) gate=(--fail-on "$IN_FAIL_ON") ;;
          *) echo "::error title=OpenPulse::unknown fail-on '$IN_FAIL_ON'"; exit 2 ;;
        esac

        summary="$RUNNER_TEMP/openpulse-summary.md"
        # A stale file from an earlier step must never pass for this run.
        rm -f "$summary" "$IN_SARIF" "$IN_CONTRACTS"
        set +e
        # ${a[@]+...}: empty arrays under `set -u` on bash 3.2 (macOS).
        "$OPENPULSE_BIN/openpulse" attest "${args[@]}" "${events[@]}" ${gate[@]+"${gate[@]}"} \
          ${trust[@]+"${trust[@]}"} ${policy[@]+"${policy[@]}"} ${changes[@]+"${changes[@]}"}           ${observe[@]+"${observe[@]}"} ${ledger[@]+"${ledger[@]}"} \
          --output "$IN_CONTRACTS" --sarif "$IN_SARIF" --summary "$summary"
        rc=$?
        set -e
        if [ ! -f "$IN_SARIF" ] || [ ! -f "$summary" ]; then
          echo "::error title=OpenPulse::attest failed before writing results (exit $rc)"
          exit "$rc"
        fi
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        cat "$summary"

        coverage="$("$OPENPULSE_BIN/python" -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["runs"][0]["properties"]["inspection_coverage"])' "$IN_SARIF")"
        if [ "$coverage" != "COMPLETE" ] && [ "$coverage" != "NOT_APPLICABLE" ]; then
          echo "::warning title=OpenPulse coverage::repository inspection coverage $coverage - results are not a clean bill of health"
        fi
        # Outputs exist, so a non-zero exit is a gate: fail-on or the trust
        # policy (input and schema errors exit before anything is written).
        breached=false
        [ "$rc" -ne 0 ] && breached=true
        {
          echo "sarif-file=$IN_SARIF"
          echo "contracts-file=$IN_CONTRACTS"
          echo "inspection-coverage=$coverage"
          echo "threshold-breached=$breached"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$new_file" ] && [ -f "$new_file" ]; then
          new_count="$("$OPENPULSE_BIN/python" -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["new_facts"])' "$new_file")"
          {
            echo "new-findings=$new_count"
            echo "new-findings-file=$new_file"
          } >> "$GITHUB_OUTPUT"
        fi

    # Delivery (v0.21.0 W5). Threats: a pull request's findings posted as news
    # (only the default branch delivers: its history is the one that is
    # saved, so each finding is sent once); secrets in argv (the URL, the
    # signing secret and the token are env only); a failed post that nobody
    # notices (the job fails at the end, after the history is saved).
    - id: deliver
      if: >-
        steps.run.outputs.new-findings-file != ''
        && (inputs.notify-webhook != '' || inputs.notify-issue == 'on')
      name: Deliver new findings
      shell: bash
      env:
        NEW_FILE: ${{ steps.run.outputs.new-findings-file }}
        ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        OPENPULSE_WEBHOOK_URL: ${{ inputs.notify-webhook }}
        OPENPULSE_WEBHOOK_SECRET: ${{ inputs.notify-webhook-secret }}
        IN_NOTIFY_ISSUE: ${{ inputs.notify-issue }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ISSUE_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [ "$ON_DEFAULT_BRANCH" != "true" ]; then
          echo "OpenPulse: new findings are delivered only from the default branch"
          echo "delivery=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        news="$("$OPENPULSE_BIN/python" -c 'import sys; from core.new_delivery import deliverable, load_new_findings; print("yes" if deliverable(load_new_findings(sys.argv[1])) else "no")' "$NEW_FILE")"
        if [ "$news" != "yes" ]; then
          echo "OpenPulse: nothing new to deliver"
          echo "delivery=none" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        target=(--run-url "$RUN_URL")
        [ "$IN_NOTIFY_ISSUE" = on ] && target+=(--issue "$ISSUE_REPO")
        if "$OPENPULSE_BIN/openpulse" deliver-new "$NEW_FILE" "${target[@]}"; then
          echo "delivery=delivered" >> "$GITHUB_OUTPUT"
        else
          echo "::error title=OpenPulse::a new finding could not be delivered (see the log); it is in this run's job summary and will not be listed again"
          echo "delivery=failed" >> "$GITHUB_OUTPUT"
        fi

    # Threat: an unpinned upload action - pinned by SHA like ci.yml.
    - if: inputs.upload-sarif == 'true' && inputs.gate == ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: openpulse

    # Saved even when a gate failed (the history is still true), never after a
    # refused audit, and only on the default branch: a pull request's history
    # never becomes the one scheduled runs build on.
    - if: >-
        !cancelled() && steps.history-audit.outcome == 'success'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        && hashFiles('.openpulse/observations/**', '.openpulse/detections/**') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .openpulse/observations
          .openpulse/detections
        key: openpulse-history-v1-${{ inputs.history-id }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Enforce fail-on
      if: steps.run.outputs.threshold-breached == 'true'
      shell: bash
      env:
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_COVERAGE: ${{ steps.run.outputs.inspection-coverage }}
      run: |
        if [ "$IN_COVERAGE" = "FAILED" ]; then
          echo "::error title=OpenPulse::repository inspection coverage FAILED - a gate never passes on a repository it could not read"
        else
          echo "::error title=OpenPulse::gate failed: fail-on $IN_FAIL_ON threshold or a trust policy violation (see the job summary and log)"
        fi
        exit 1

    - name: Report a failed delivery
      if: steps.deliver.outputs.delivery == 'failed'
      shell: bash
      run: |
        echo "::error title=OpenPulse::new findings were not delivered (see the Deliver new findings step)"
        exit 1

    - name: Enforce the gate
      if: steps.gate.outputs.threshold-breached == 'true'
      shell: bash
      run: |
        echo "::error title=OpenPulse gate::the trust policy prohibits a dependency (see the log above); nothing should be installed"
        exit 1
