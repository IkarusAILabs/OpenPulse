# Dependabot configuration for OpenPulse.
#
# The pip ecosystem scans recursively and therefore picks up the test-only
# fixture manifests under data/fixtures/ (for example
# data/fixtures/manifests/requirements.txt, which pins django==4.2 on purpose
# so the golden tests assert that an EOL Django pin is AFFECTS_VERSION).
# Those pins are test data, not real OpenPulse dependencies (see
# pyproject.toml), so `exclude-paths` keeps Dependabot from opening version
# update pull requests against them.
#
# NOTE: `exclude-paths` only suppresses *update* pull requests. Dependabot
# *security alerts* are produced by the dependency graph, which still parses
# these fixtures; those alerts are reviewed and dismissed as test-data false
# positives rather than by bumping the intentionally vulnerable pins.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    exclude-paths:
      - "data/fixtures/**"
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
