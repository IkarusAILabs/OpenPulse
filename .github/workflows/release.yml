name: release
# Threat: a release artifact nobody can tie to the reviewed commit, lock and
# SBOM (#111, v0.10.0 item V1). A `v*` tag builds the sdist and wheel from
# the tagged tree with hash-locked tools, refuses a tag that disagrees with
# the package version, regenerates the deterministic SBOM, attests build
# provenance for every file, and attaches them all to the GitHub release.
# Nothing is published to PyPI (owner decision 7 in docs/NEXT_PHASES.md).
on:
  push:
    tags: ['v*']
# Every job asks for exactly what it needs; the default is nothing.
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.11'}
      # Threat: a build tool fetched at build time. pip and setuptools come
      # from the hash-checked CI lock, and the build runs without isolation.
      - run: python -m pip install --require-hashes -r .github/ci-tools.lock
      # Threat: a tag that names another version than the one built.
      - name: Build sdist and wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python scripts/build_release.py "$TAG" dist
      # Threat: unlisted transitive deps - the same deterministic SBOM CI
      # checks, regenerated from the tagged lock and compared byte for byte.
      - run: |
          python scripts/gen_sbom.py requirements.lock dist/sbom.cdx.json
          python scripts/gen_sbom.py requirements.lock "$RUNNER_TEMP/sbom-again.json"
          cmp dist/sbom.cdx.json "$RUNNER_TEMP/sbom-again.json"
      # Threat: a wheel that builds but does not run, or reports another
      # version. Install it with the hash-locked runtime deps into a clean
      # venv and run it from outside the checkout.
      - name: Smoke-test the wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv "$RUNNER_TEMP/wheelvenv"
          WPY="$RUNNER_TEMP/wheelvenv/bin/python"
          "$WPY" -m pip install -q --require-hashes -r requirements-runtime.lock
          "$WPY" -m pip install -q --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/wheelvenv/bin/openpulse" --version)" = "openpulse, version ${TAG#v}"
          "$WPY" -I -c "from core.evidence_contract import SCHEMA_V2_PATH; from core.resources import data_path; assert SCHEMA_V2_PATH.exists(); assert data_path('fixtures', 'django-eol', 'event.json').exists()"
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: release-dist, path: dist/, if-no-files-found: error}
  attest:
    needs: build
    runs-on: ubuntu-latest
    # id-token and attestations: write only here, for the signing step.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-dist, path: dist}
      # Sigstore-signed SLSA build provenance for every released file;
      # verify with `gh attestation verify <file> --repo IkarusAILabs/OpenPulse`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'dist/*'}
  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    # contents: write only here, to attach files to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-dist, path: dist}
      # A release made by hand before the tag keeps its notes; otherwise the
      # notes are the tag's CHANGELOG section. Existing files are never
      # replaced (no --clobber): a re-run must not swap attested artifacts.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*
          else
            awk -v v="${TAG#v}" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            test -s "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          fi
