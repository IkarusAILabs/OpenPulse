name: paper
# Builds papers/tr-2026-01 (TR-2026-01) and the prevalence paper with latexmk and uploads the PDF
# and the build log, so the published PDF always comes from the committed
# source, plus a verified arXiv source bundle. The authoring machine has
# no TeX installation.
on:
  pull_request:
    paths: ['papers/**', '.github/workflows/paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Threat: the job token left in .git/config for every later step,
      # third-party tooling included - this job never pushes (#141).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          working_directory: papers/tr-2026-01
          latexmk_use_lualatex: false
      # Undefined references or citations leave "??" in the PDF; fail on them.
      - run: |
          log=papers/tr-2026-01/main.log
          ! grep -E "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references" "$log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tr-2026-01
          path: |
            papers/tr-2026-01/main.pdf
            papers/tr-2026-01/main.log
            papers/tr-2026-01/main.blg
          if-no-files-found: warn
      # arXiv bundle: arXiv publishes the source and does not run BibTeX,
      # so ship main.tex without full-line comments plus the generated
      # main.bbl, then rebuild the bundle with BibTeX disabled to prove it
      # compiles the way arXiv will compile it.
      - name: Assemble arXiv bundle
        run: |
          mkdir -p arxiv
          sed '/^[[:space:]]*%/d' papers/tr-2026-01/main.tex > arxiv/main.tex
          cp papers/tr-2026-01/main.bbl arxiv/main.bbl
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          working_directory: arxiv
          args: "-pdf -bibtex- -file-line-error -halt-on-error -interaction=nonstopmode"
      - name: Check and pack arXiv bundle
        run: |
          ! grep -E "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references" arxiv/main.log
          tar -czf tr-2026-01-arxiv.tar.gz -C arxiv main.tex main.bbl
          tar -tzf tr-2026-01-arxiv.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tr-2026-01-arxiv
          path: |
            tr-2026-01-arxiv.tar.gz
            arxiv/main.pdf
          if-no-files-found: error
  # The prevalence paper (papers/prevalence/paper). Its numbers come from
  # results.tex, generated from the frozen run; fail if the committed file
  # differs from what the data produces, then build the PDF.
  prevalence:
    runs-on: ubuntu-latest
    steps:
      # Threat: the job token left in .git/config for every later step,
      # third-party tooling included - this job never pushes (#141).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Regenerate results.tex from the frozen run
        working-directory: papers/prevalence
        run: |
          python3 paper/tables.py data/main/measures.jsonl > paper/results.tex
          git diff --exit-code -- paper/results.tex
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          working_directory: papers/prevalence/paper
          latexmk_use_lualatex: false
      - run: |
          ! grep -E "LaTeX Warning: (Reference|Citation) .* undefined|There were undefined references|Overfull" papers/prevalence/paper/main.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prevalence-paper
          path: |
            papers/prevalence/paper/main.pdf
            papers/prevalence/paper/main.log
          if-no-files-found: warn
