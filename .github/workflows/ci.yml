name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # `run:` defaults to PowerShell on windows-latest, which breaks
        # bash idioms used below (`&&` toolchain chaining, `cp`/`cmp`,
        # `> /dev/null`). Git Bash ships on every runner image, so pin
        # the whole job to bash and keep the steps OS-agnostic.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.11'}
      # `python -m pip`: on Windows pip refuses to replace itself through the
      # pip.exe launcher, which fails the job whenever the runner image's pip
      # differs from the pinned one.
      # Threat: re-uploaded or tampered artifacts with the same version, and
      # floated transitive deps. Every install is hash-checked
      # (--require-hashes), every transitive dependency must be in the lock,
      # and --exact fails on anything installed that the lock doesn't list.
      # Regenerate the locks with scripts/compile_locks.py.
      - run: python -m pip install --require-hashes -r .github/ci-tools.lock
      - run: python -m pip install --require-hashes -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pip check && python scripts/check_lock.py --exact
      - run: ruff check .
      # Threat: a written-but-excluded test is not a test (F7).
      - run: python scripts/check_ci_runs_all_tests.py
      - run: pytest -q
      - run: python -m pip install --require-hashes -r .github/audit-tools.lock && pip-audit --desc
      # Threat: accidental credential commits — stdlib tripwire ( complements,
      # not replaces, GitHub push protection, which should stay enabled).
      - run: python scripts/scan_secrets.py .
      # Threat: unlisted transitive deps reaching users — deterministic SBOM
      # of exactly what the lock pins (serial number derives from the lock,
      # so identical locks produce identical SBOMs).
      - run: python scripts/gen_sbom.py && python -m json.tool sbom.json > /dev/null
      # Threat: nondeterministic SBOM — regenerating must reproduce the file
      # byte for byte, so the archived artifact is provably the reviewed
      # lock set and can be regenerated from requirements.lock alone.
      - run: cp sbom.json "$RUNNER_TEMP/sbom-first.json" && python scripts/gen_sbom.py && cmp sbom.json "$RUNNER_TEMP/sbom-first.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: openpulse-sbom, path: sbom.json, if-no-files-found: error}
      # Threat: broken packaging — the console script and key entry points
      # must import and respond after a real install.
      - run: openpulse --help && python -c "import cli.main, core.notify, core.observations.sweep"
      # Threat: a wheel that imports but ships no data - a plain `pip install`
      # silently ran with an empty catalog (every identity resolving to itself)
      # and without the evidence-contract schemas. Install the built wheel into
      # a clean venv and exercise it from outside the checkout.
      - run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/wheel" .
          python -m venv "$RUNNER_TEMP/wheelvenv"
          WPY="$RUNNER_TEMP/wheelvenv/bin/python"
          [ -x "$WPY" ] || WPY="$RUNNER_TEMP/wheelvenv/Scripts/python.exe"
          "$WPY" -m pip install -q "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          "$WPY" -I -c "from core.entities.resolve import resolve_project; from core.evidence_contract import SCHEMA_PATH; from core.resources import data_path; assert resolve_project('postgres:16') == 'postgresql'; assert SCHEMA_PATH.exists(); assert data_path('fixtures', 'django-eol', 'event.json').exists()"
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with: {languages: python}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
  action:
    # Threat: the shipped GitHub Action drifting from the CLI it wraps -
    # dogfood it on every push against the repo's own offline fixtures
    # (no SARIF upload: fixture findings must not become alerts here).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: pass
        uses: ./
        with:
          manifest: data/fixtures/manifests/requirements.txt
          lockfile: data/fixtures/lockfiles/poetry.lock
          images: data/fixtures/images/inventory_sample.txt
          fail-on: critical
          sarif-file: ${{ runner.temp }}/pass.sarif
          contracts-file: ${{ runner.temp }}/pass.jsonl
      # Threat: a gate that never fires - django==4.2 vs the curated Django
      # EOL event is ACTION, so the default threshold must fail the step.
      - id: gate
        continue-on-error: true
        uses: ./
        with:
          manifest: data/fixtures/manifests/requirements.txt
          sarif-file: ${{ runner.temp }}/gate.sarif
          contracts-file: ${{ runner.temp }}/gate.jsonl
      - name: Check action outputs
        env:
          PASS_SARIF: ${{ steps.pass.outputs.sarif-file }}
          PASS_BREACHED: ${{ steps.pass.outputs.threshold-breached }}
          PASS_COVERAGE: ${{ steps.pass.outputs.inspection-coverage }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          test "$PASS_BREACHED" = false
          test "$PASS_COVERAGE" = COMPLETE
          test "$GATE_OUTCOME" = failure
          # OPENPULSE_BIN: the venv the action installed (exported via GITHUB_ENV).
          "$OPENPULSE_BIN/python" - "$PASS_SARIF" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))["runs"][0]
          levels = {r["level"] for r in run["results"]}
          assert "error" in levels, levels
          assert all(r["properties"].get("content_hash") or r["properties"].get("content_hashes")
                     for r in run["results"])
          PY
  mcp:
    # Threat: the optional MCP extra (`openpulse[mcp]`) pulls ~20 packages
    # the core never installs. They have their own reviewed lock
    # (requirements-mcp.lock): install exactly that set, prove it is
    # consistent with the core lock, audit it, and run the MCP server tests
    # that the `test` job skips for lack of the SDK - including a real
    # stdio session through the SDK's own client.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.11'}
      - run: python -m pip install --require-hashes -r .github/ci-tools.lock
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-mcp.lock && python -m pip install --no-deps -e .
      - run: python -m pip check && python scripts/check_lock.py --exact requirements.lock requirements-mcp.lock
      - run: python -m pytest -q tests/test_mcp_server.py tests/test_agent_tools.py
      - run: python -m pip install --require-hashes -r .github/audit-tools.lock && pip-audit --desc
  comparators:
    # Baseline V's pinned ecosystem comparators (evaluation/comparators/README.md):
    # the real node-semver, Go x/mod/semver and Maven ComparableVersion, run
    # against documented semantics, then OpenPulse's own comparison cross-checked
    # against them. Every pin is exact: npm by lockfile integrity, Go by go.sum,
    # the Maven jar by SHA-256 (fetch.py), toolchains by version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.11'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.22.0'}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: evaluation/comparators/go/go.mod, cache: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: {distribution: temurin, java-version: '25'}
      - run: python -m pip install --require-hashes -r .github/ci-tools.lock
      - run: python -m pip install --require-hashes -r requirements.lock && python -m pip install --no-deps -e .
      # Threat: a floated or tampered comparator. npm ci installs exactly the
      # lockfile (integrity-checked) and runs no install scripts; Go builds
      # read-only against go.sum; the jar is SHA-256-verified before use.
      - run: npm ci
        working-directory: evaluation/comparators/npm
        env: {npm_config_ignore_scripts: 'true'}
      - run: go build -mod=readonly -trimpath -o bridge .
        working-directory: evaluation/comparators/go
      - run: python evaluation/comparators/maven/fetch.py
      # Skips become failures here: the bridges must actually run.
      - run: OPENPULSE_REQUIRE_COMPARATORS=1 pytest -q tests/test_ecosystem_comparators.py tests/test_ecosystem_versions.py
      - run: python evaluation/comparators/crosscheck.py --out "$RUNNER_TEMP/ecosystem_comparators.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: ecosystem-comparators, path: "${{ runner.temp }}/ecosystem_comparators.json", if-no-files-found: warn}
