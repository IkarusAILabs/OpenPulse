name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - run: pip install -U pip "setuptools>=83" && pip install -e ".[dev]" && pip install pip-audit
      # Threat: floated transitive deps — the lock is the reviewed set.
      - run: pip install -r requirements.lock && python scripts/check_lock.py
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit --desc
      # Threat: accidental credential commits — stdlib tripwire ( complements,
      # not replaces, GitHub push protection, which should stay enabled).
      - run: python scripts/scan_secrets.py .
      # Threat: unlisted transitive deps reaching users — deterministic SBOM
      # of exactly what the lock pins (serial number derives from the lock,
      # so identical locks produce identical SBOMs).
      - run: python scripts/gen_sbom.py && python -m json.tool sbom.json > /dev/null
      # Threat: broken packaging — the console script and key entry points
      # must import and respond after a real install.
      - run: openpulse --help && python -c "import cli.main, core.notify, core.observations.sweep"
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with: {languages: python}
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
