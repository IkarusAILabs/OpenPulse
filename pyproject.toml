[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openpulse"
version = "0.6.3"
description = "OpenPulse - OSS Dependency Intelligence with evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "click>=8.5.0",
]

# Explicit package list (pinned against find_packages by
# tests/test_packaging.py) so the runtime data directories can ship as
# packages too: `data/` (catalog, seed, curated events) and `schemas/`
# (evidence-contract JSON Schemas) are needed by an installed wheel, not
# only by a source checkout. core.resources resolves both layouts.
[tool.setuptools]
packages = [
  "analyzers", "analyzers.activity", "analyzers.distribution", "analyzers.license",
  "analyzers.lifecycle", "analyzers.security", "analyzers.support",
  "cli",
  "collectors", "collectors.cve", "collectors.endoflife", "collectors.github",
  "collectors.kev", "collectors.nvd", "collectors.osv", "collectors.registries",
  "core", "core.detections", "core.entities", "core.events", "core.evidence",
  "core.observations", "core.risk", "core.schema",
  "reports",
  "openpulse_data", "openpulse_schemas",
]
package-dir = {"openpulse_data" = "data", "openpulse_schemas" = "schemas"}

[tool.setuptools.package-data]
openpulse_data = ["*.yaml", "fixtures/*/event.json"]
openpulse_schemas = ["evidence-contract/*/schema.json"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]
# MCP server for AI coding agents (`openpulse mcp`); pins in requirements-mcp.lock.
mcp = ["mcp>=2.3.0"]

[project.scripts]
openpulse = "cli.main:cli"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["SIM115", "SIM102", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
